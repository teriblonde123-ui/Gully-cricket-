<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gully Cricket 2D - Arcade Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', sans-serif; }
        body { background: #111; color: #fff; text-align: center; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
        h1 { color: #f39c12; margin: 10px 0; text-shadow: 2px 2px #c0392b; font-size: 24px; }
        
        #hud { display: flex; justify-content: space-between; width: 600px; max-width: 100%; background: #222; padding: 10px; border-radius: 8px 8px 0 0; border: 2px solid #444; border-bottom: none; font-family: monospace; font-size: 16px; color: #2ecc71; }
        
        canvas { background: #111; border: 2px solid #444; max-width: 100%; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        
        #controls-info { width: 600px; max-width: 100%; background: #222; padding: 10px; border-radius: 0 0 8px 8px; border: 2px solid #444; border-top: none; font-size: 13px; color: #ccc; }
        
        .btn-group { display: flex; gap: 8px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
        button { background: #e67e22; border: none; color: white; padding: 10px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #d35400; transform: scale(1.05); }
        
        #log { margin-top: 10px; color: #f1c40f; font-size: 14px; min-height: 20px; font-family: monospace; }
    </style>
</head>
<body>

    <h1>🏏 GULLY CRICKET: ARCADE 2D 🏏</h1>

    <div id="hud">
        <div>SCORE: <span id="runs">0</span>/<span id="wickets">0</span></div>
        <div>BALLS: <span id="balls">0</span>/6</div>
        <div>TARGET: <span id="target">18</span></div>
    </div>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div id="controls-info">
        <p><strong>Controls:</strong> Press <strong>[A]</strong> Defensive / Ground | <strong>[S]</strong> Straight Drive | <strong>[D]</strong> High Lofted</p>
        <div class="btn-group">
            <button onclick="triggerShot('defend')">A: Ground</button>
            <button onclick="triggerShot('drive')">S: Drive</button>
            <button onclick="triggerShot('loft')">D: Lofted</button>
            <button onclick="bowlBall()" style="background:#27ae60">Bowl Next Ball</button>
            <button onclick="resetGame()" style="background:#c0392b">Restart</button>
        </div>
    </div>

    <div id="log">Press "Bowl Next Ball" to start!</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Audio Generator (No external assets required!)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'hit') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'break') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'cheer') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // Game Variables
    let runs = 0, wickets = 0, balls = 0, target = 18;
    let gameState = 'IDLE'; // IDLE, BOWLING, SHOT_PLAYED, OVER
    let batAngle = 0;
    
    // Objects
    const bowler = { x: 300, y: 60 };
    const batsman = { x: 300, y: 340 };
    const ball = { x: 300, y: 60, vx: 0, vy: 0, radius: 5, active: false, isLofted: false };
    
    const auntyWindow = { x: 480, y: 20, w: 100, h: 80 };
    const parkedCar = { x: 20, y: 180, w: 90, h: 50 };

    // Keyboard Listeners
    window.addEventListener('keydown', (e) => {
        if (e.key === 'a' || e.key === 'A') triggerShot('defend');
        if (e.key === 's' || e.key === 'S') triggerShot('drive');
        if (e.key === 'd' || e.key === 'D') triggerShot('loft');
    });

    function log(msg) {
        document.getElementById("log").innerText = msg;
    }

    function updateHUD() {
        document.getElementById("runs").innerText = runs;
        document.getElementById("wickets").innerText = wickets;
        document.getElementById("balls").innerText = balls;
        document.getElementById("target").innerText = target;
    }

    function bowlBall() {
        if (gameState === 'BOWLING' || gameState === 'SHOT_PLAYED') return;
        if (balls >= 6 || wickets >= 2 || runs >= target) return;

        gameState = 'BOWLING';
        ball.x = bowler.x;
        ball.y = bowler.y;
        ball.vx = (Math.random() - 0.5) * 1.5; // slight seam movement
        ball.vy = 4 + Math.random() * 2; // speed
        ball.active = true;
        ball.isLofted = false;
        batAngle = 0;
        log("Bowler bowls! Time your shot...");
    }

    function triggerShot(type) {
        if (gameState !== 'BOWLING') return;
        
        // Check timing window
        const dist = Math.abs(ball.y - batsman.y);
        if (dist > 50) {
            log("SWUNG TOO EARLY/LATE! Missed the ball.");
            return;
        }

        playSound('hit');
        gameState = 'SHOT_PLAYED';
        batAngle = -0.8; // Swing animation

        if (type === 'defend') {
            ball.vy = -1 - Math.random() * 2;
            ball.vx = (Math.random() - 0.5) * 4;
            ball.isLofted = false;
            evaluateShot('defend');
        } else if (type === 'drive') {
            ball.vy = -5 - Math.random() * 3;
            ball.vx = (Math.random() - 0.5) * 6;
            ball.isLofted = false;
            evaluateShot('drive');
        } else if (type === 'loft') {
            ball.vy = -7 - Math.random() * 3;
            ball.vx = (Math.random() - 0.5) * 10;
            ball.isLofted = true;
            evaluateShot('loft');
        }
    }

    function evaluateShot(type) {
        balls++;
        let outcomeRuns = 0;

        setTimeout(() => {
            // Collision & Rules check
            if (ball.x > auntyWindow.x && ball.y < auntyWindow.y + auntyWindow.h) {
                // Hitting Aunty's House / Glass
                playSound('break');
                wickets++;
                log("👵💥 GLASS SHATTERED! Ball went into Aunty's house! OUT & Ball confiscated!");
            } else if (ball.x < parkedCar.x + parkedCar.w && ball.y > parkedCar.y && ball.y < parkedCar.y + parkedCar.h) {
                // Car Hit
                runs = Math.max(0, runs - 1);
                log("🚗 HIT UNCLE'S CAR! 1 Run penalty for denting the door!");
            } else if (ball.y < 0) {
                // Over Roof Boundary Rule
                if (ball.isLofted) {
                    wickets++;
                    log("🚫 OUT! 'Jo Fenke-ga Wohi Laayega!' Hit over the roof = Lost Ball OUT!");
                } else {
                    outcomeRuns = 4;
                    runs += 4;
                    playSound('cheer');
                    log("🔥 FOUR! Great ground shot through the alley!");
                }
            } else if (type === 'loft' && Math.random() < 0.35) {
                // One Tappa / Wall Catch
                wickets++;
                log("❌ OUT! One-Tappa (One Bounce) catch taken off the wall!");
            } else {
                outcomeRuns = type === 'defend' ? 1 : 2;
                runs += outcomeRuns;
                log(`🏏 Safe Shot! Got ${outcomeRuns} run(s).`);
            }

            updateHUD();
            checkMatchStatus();
        }, 800);
    }

    function checkMatchStatus() {
        if (runs >= target) {
            log("🏆 VICTORY! You chased down the target and conquered the Gully!");
            gameState = 'OVER';
        } else if (wickets >= 2) {
            log("💀 ALL OUT! No balls left or too many broken windows. Match Lost!");
            gameState = 'OVER';
        } else if (balls >= 6) {
            log(`🔚 OVER FINISHED! Final Score: ${runs}/${wickets}. Target was ${target}.`);
            gameState = 'OVER';
        } else {
            gameState = 'IDLE';
        }
    }

    function resetGame() {
        runs = 0; wickets = 0; balls = 0;
        target = 15 + Math.floor(Math.random() * 10);
        gameState = 'IDLE';
        ball.active = false;
        updateHUD();
        log("Game Reset! Click 'Bowl Next Ball'.");
    }

    // Engine Render Loop
    function update() {
        // Move Ball
        if (ball.active) {
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Dot ball / Bowled check
            if (ball.y > 370 && gameState === 'BOWLING') {
                ball.active = false;
                balls++;
                wickets++;
                log("❌ BOWLED / MISSED! You didn't connect with the ball.");
                updateHUD();
                checkMatchStatus();
            }
        }

        // Smooth Bat angle return
        if (batAngle < 0) batAngle += 0.05;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Draw Alley/Gully Surroundings
        ctx.fillStyle = "#3e2723"; // Walls/Buildings
        ctx.fillRect(0, 0, 120, canvas.height);
        ctx.fillRect(480, 0, 120, canvas.height);

        // Pitch
        ctx.fillStyle = "#d7ccc8";
        ctx.fillRect(120, 0, 360, canvas.height);

        // Pitch Crease
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(220, 340); ctx.lineTo(380, 340); // Batting crease
        ctx.moveTo(240, 70); ctx.lineTo(360, 70);  // Bowling crease
        ctx.stroke();

        // 2. Draw Aunty's Balcony Window (Top Right)
        ctx.fillStyle = "#00bcd4";
        ctx.fillRect(auntyWindow.x, auntyWindow.y, auntyWindow.w, auntyWindow.h);
        ctx.strokeStyle = "#fff";
        ctx.strokeRect(auntyWindow.x, auntyWindow.y, auntyWindow.w, auntyWindow.h);
        ctx.fillStyle = "#fff";
        ctx.font = "12px sans-serif";
        ctx.fillText("👵 Aunty's Window", auntyWindow.x + 5, auntyWindow.y + 45);

        // 3. Draw Parked Car (Left Wall)
        ctx.fillStyle = "#e74c3c";
        ctx.fillRect(parkedCar.x, parkedCar.y, parkedCar.w, parkedCar.h);
        ctx.fillStyle = "#fff";
        ctx.fillText("🚗 Parked Car", parkedCar.x + 10, parkedCar.y + 30);

        // 4. Draw Wickets
        ctx.fillStyle = "#fff";
        for (let i = -10; i <= 10; i += 10) {
            ctx.fillRect(batsman.x + i - 2, batsman.y + 10, 4, 20); // Batting stumps
            ctx.fillRect(bowler.x + i - 2, bowler.y - 20, 4, 20);  // Bowling stumps
        }

        // 5. Draw Bowler & Batsman
        // Bowler
        ctx.fillStyle = "#f39c12";
        ctx.beginPath(); ctx.arc(bowler.x, bowler.y, 12, 0, Math.PI * 2); ctx.fill();

        // Batsman
        ctx.fillStyle = "#2980b9";
        ctx.beginPath(); ctx.arc(batsman.x, batsman.y, 12, 0, Math.PI * 2); ctx.fill();

        // Bat
        ctx.save();
        ctx.translate(batsman.x + 10, batsman.y);
        ctx.rotate(batAngle);
        ctx.fillStyle = "#8d6e63";
        ctx.fillRect(0, -25, 6, 30);
        ctx.restore();

        // 6. Draw Ball
        if (ball.active) {
            ctx.fillStyle = ball.isLofted ? "#ffeb3b" : "#d32f2f";
            ctx.beginPath();
            // Scaling ball size if lofted to give 3D height effect
            let currentRadius = ball.isLofted ? ball.radius + 3 : ball.radius;
            ctx.arc(ball.x, ball.y, currentRadius, 0, Math.PI * 2);
            ctx.fill();
        }

        update();
        requestAnimationFrame(draw);
    }

    // Start Engine
    draw();
</script>
</body>
</html>
